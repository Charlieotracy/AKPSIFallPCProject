# Provisional: P2 owns backend packaging and CI. This exists so the orchestrator tests run.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-uw-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9,<3",
    "pydantic>=2.7,<3",
    "tzdata",  # zoneinfo data on machines without a system tz database (Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agent.orchestrator" = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Claude API; opt in with JEV_LIVE_TESTS=1"]

[tool.ruff]
line-length = 100
target-version = "py312"
