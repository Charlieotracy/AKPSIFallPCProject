name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Test-only credentials for this throwaway CI container; not secrets.
          POSTGRES_USER: jev
          POSTGRES_PASSWORD: jev
          POSTGRES_DB: jev_uw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jev -d jev_uw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://jev:jev@localhost:5432/jev_uw_test
      TEST_DATABASE_URL: postgresql+asyncpg://jev:jev@localhost:5432/jev_uw_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Migrate (PostgreSQL)
        run: uv run alembic upgrade head

      - name: Check models match migrations (PostgreSQL)
        run: uv run alembic check

      - name: Tests (PostgreSQL)
        run: uv run pytest -q --junitxml=reports/pytest-postgres.xml

      - name: Tests (SQLite)
        run: TEST_DATABASE_URL= uv run pytest -q --junitxml=reports/pytest-sqlite.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
